# @package experiment.env_params
# X2UltraReal tracking env (MJX / MjWarp).
#
# The control function, the observations, the reward, the goal, the terminal handler and the
# randomizer are the classes the G1 uses, hence their `G1Real...` names: they read joint, body
# and geom names from the env. Their settings here are the X2's own.
defaults:
  - _self_
  - robot: x2_ultra_29dof_robot
  - control: position
  - observation: tracking
  - reward: tracking
  - goal: anchor
  - terminal: tracking
  - randomization: sim2real

env_name: MjxX2UltraReal
init_state_type: TrajInitialStateHandler

# 500 steps at 50 Hz = 10 s.
horizon: 500

# timestep * n_substeps = 0.02 s control step (50 Hz).
timestep: 0.005
n_substeps: 4

headless: True

# MjWarp handles the full self-collision set far better than MJX. It is flagged
# experimental in loco_mujoco: its reset reuses the previous `data`.
use_mjwarp: True

model_option_conf:
  iterations: 10
  ls_iterations: 20
  ccd_iterations: 50

th_params:
  max_n_samples: 200_000
  max_n_trajs: 20
