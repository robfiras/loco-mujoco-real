# @package experiment.env_params
# This randomizes SENSING AND DISTURBANCES, not the plant. Every inherited plant knob defaults to off in G1RealRandomizer; set them here
# to opt back in.
domain_randomization_type: G1RealRandomizer
domain_randomization_params:
  # push_robot: add a uniform impulse to the root velocity every U(1, 3) s.
  enable_push: true
  push_interval_range_s: [1.0, 3.0]
  # (x, y, z, roll, pitch, yaw)
  push_velocity_range:
    - [-0.5, 0.5]
    - [-0.5, 0.5]
    - [-0.2, 0.2]
    - [-0.52, 0.52]
    - [-0.52, 0.52]
    - [-0.78, 0.78]

  # Persistent per-episode joint-position sensing bias.
  enable_encoder_bias: true
  encoder_bias_range: [-0.02, 0.02]

  # One shared friction draw, on every colliding robot geom. MuJoCo takes the larger
  # friction of a pair, so the floor sits at the bottom of the range to let the draw win.
  enable_foot_friction: true
  foot_friction_range: [0.3, 1.2]
  friction_all_geoms: true
  ground_friction: 0.3

  # Pelvis CoM offset, per axis half-width.
  enable_base_com: true
  base_com_range: [0.025, 0.05, 0.05]

  # Uniform noise half-widths on the corrupted (actor) group only.
  joint_pos_obs_noise: 0.01
  joint_vel_obs_noise: 0.5
  base_ang_vel_obs_noise: 0.2
  # The group the randomizer may corrupt AND delay. `history` holds the actor's
  # sensed terms; the critic's clean duplicates live in `privileged_state` and are
  # therefore untouchable by construction, not just by flag.
  noisy_obs_group: history
