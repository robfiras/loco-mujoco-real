# SuperMimic motion tracking on MjxX2UltraReal.
#
# Train, overriding anything below on the command line:
#   python training/x2/train_supermimic.py
#   python training/x2/train_supermimic.py experiment.seed=1
#
# The environment is the one PPO trains on (env/mjx_x2_ultra_real.yaml), with the changes listed under
# `goal_observation_spec` and `env_params`. This file comes after the env group in the defaults,
# so its `env_params` win.
defaults:
  - env: mjx_x2_ultra_real
  - _self_
  - override hydra/job_logging: default
  - override hydra/launcher: basic

experiment:
  seed: 0

  # ---- data ----
  # One policy on the 40 LAFAN1 clips. LocoMuJoCo retargets clips missing from the cache to the
  # robot on first use. To train on your own .lmj.npz files, replace `lafan1_dataset_conf` by
  # `custom_dataset_conf: {paths: [...]}` and raise `env_params.th_params` to fit them.
  task_factory:
    name: ImitationFactory
    params:
      lafan1_dataset_conf:
        dataset_name:
          [dance1_subject1, dance1_subject2, dance1_subject3, dance2_subject1, dance2_subject2, dance2_subject3,
            dance2_subject4, dance2_subject5, fallAndGetUp1_subject1, fallAndGetUp1_subject4, fallAndGetUp1_subject5,
            fallAndGetUp2_subject2, fallAndGetUp2_subject3, fallAndGetUp3_subject1, fight1_subject2, fight1_subject3,
            fight1_subject5, fightAndSports1_subject1, fightAndSports1_subject4, jumps1_subject1, jumps1_subject2,
            jumps1_subject5, run1_subject2, run1_subject5, run2_subject1, run2_subject4, sprint1_subject2, sprint1_subject4,
            walk1_subject1, walk1_subject2, walk1_subject5, walk2_subject1, walk2_subject3, walk2_subject4, walk3_subject1,
            walk3_subject2, walk3_subject3, walk3_subject4, walk3_subject5, walk4_subject1]

  # ---- length of training ----
  # 4096 environments x 37,400 iterations = 153 million steps, about 50 minutes on one 48 GB GPU.
  # `total_timesteps` only sets the length of the learning-rate schedule; training stops at
  # `max_iterations`. Each chunk ends with a checkpoint, and rerunning in the same output
  # directory resumes from it.
  num_envs: 4096
  total_timesteps: 1310000000.0
  max_iterations: 37400
  iterations_per_chunk: 1100
  keep_every_steps: 9e6

  # ---- observations SuperMimic reads in addition to the environment's own ----
  # Put in front of the environment's observation spec by training/supermimic.py: the next
  # reference frames for the critic and the world model, and the root orientation error for the
  # termination check inside imagined rollouts.
  goal_observation_spec:
    - type: TrajFutureFrames
      n_future: 10
      group: [future_goal]
    - type: RootOriRelTraj
      group: [ref_ori]

  # ---- environment settings that differ from the PPO recipe ----
  env_params:
    model_option_conf:
      {iterations: 100, ls_iterations: 50, ccd_iterations: 35, tolerance: 1.0e-06, integrator: 3, cone: 0, solver: 2}
    th_params:
      {max_n_samples: 1000000, max_n_trajs: 40}
    naconmax: 140000
    recenter_root_xy: false
    # every collision geom of the robot collides with every other one
    model_contact_conf:
      {self_collisions: true, condim: 3}
    # recompute body poses after each control step, so observations and reward do not lag
    refresh_kinematics: true
    # noise added to the reference state an episode starts from
    init_state_params:
      root_pos_noise: [0.05, 0.05, 0.01]
      root_rot_noise: [0.1, 0.1, 0.2]
      root_lin_vel_noise: [0.5, 0.5, 0.2]
      root_ang_vel_noise: [0.52, 0.52, 0.78]
      joint_pos_noise: 0.1
    reward_params:
      w_joint_limit: -2.0
    terminal_state_params:
      ee_body_pos_z_threshold: null

  # ---- algorithm ----
  hidden_layers: [2048, 1024, 512, 256]
  critic_hidden_layers: [256, 128]
  activation: elu
  lr_actor: 0.0004
  lr_critic: 0.0004
  actor_max_grad_norm: 1.0
  actor_max_grad_value: 0.1
  actor_grad_spike_factor: 10.0
  critic_max_grad_norm: 1.0
  critic_epochs: 5
  critic_minibatches: 4
  wm_hidden_layers: [1024, 1024, 1024]
  wm_term_hidden_layers: [64, 64]
  wm_activation: silu
  lr_wm: 0.0004
  wm_max_grad_norm: 1.0
  wm_window: 8
  wm_batch_size: 2048
  wm_batches_per_update: 5
  wm_term_loss_weight: 1.0
  wm_in_scale: [1.0, 1.0, 1.0, 2.0, 1.0, 5.0]
  wm_out_scale: [0.3, 0.5, 2.0, 0.01, 0.02, 0.02]
  wm_err_scale: [0.05, 0.1, 0.5, 1.0, 0.1, 2.0]
  imag_horizon: 32
  imag_batch_size: 2048
  remat: true
  gamma: 0.99
  gae_lambda: 0.95
  updates_per_env_step: 0.4
  warmup_steps: 40
  lr_final_ratio: 0.03
  lr_decay_fraction: 0.78
  action_noise_std: 0.1
  max_abs_qvel: 100.0
  buffer_len: 1000
  start_buffer_len: 64
  log_every: 50
  n_seeds: 1
  vmap_across_seeds: true
  debug: false
  validation: {active: false, num_steps: 100, num_envs: 100, num: 1}
  actor_obs_group: [tracking_goal, last_action, history]
  critic_obs_group: [future_goal, ref_ori, tracking_goal, last_action, privileged_state]
  bin_resets: true
  bin_seconds: 1.0
  max_step_reward: 0.1
  fail_reset: 0.3
  net_dtype: bfloat16
  remat_keep_dots: true
  start_buffer_stride: 16
  wm_layer_norm: true
  wm_drift: 0.625
  policy_ema: 0.995
  actor_optimizer: muon
  wm_optimizer: muon
  policy_lr_mult: 4.0
  obs_norm: true
  history_len: 10
  goal_obs_group: [future_goal]
  history_obs_group: [history, last_action, ref_ori]
  termination_obs_group: [ref_ori]
  torch_init: true
  flat_kinematics: true
  imag_soft_termination_only: true
  imag_lean: true
  wm_term_head: false
  wm_unroll: true
  imag_compact: true
