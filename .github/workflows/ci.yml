name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # no GPU and no display on the runner; nothing is logged to Weights & Biases
      JAX_PLATFORMS: cpu
      MUJOCO_GL: egl
      WANDB_MODE: disabled
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install LocoMuJoCo and this repository
        run: |
          python -m pip install --upgrade pip
          pip install "loco-mujoco[viser]>=1.2.0" pytest
          pip install -e .
          loco-mujoco-add-variable --name LOCOMUJOCO_CUSTOM_ROBOT_CONF_PATH --value "$PWD/lmj_real/smpl_robot_confs"

      - name: Test
        run: pytest tests -v --durations=10
